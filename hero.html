<!-- ══════════════ HERO ══════════════ -->
<section class="hero">

    <h1 data-en="Find the right <span>government scheme</span><br>for you, instantly" data-hi="अपने लिए सही <span>सरकारी योजना</span><br>तुरंत खोजें">
        Find the right <span>government scheme</span><br>
        for you, instantly
    </h1>

    <p data-en="Saral Niti helps every Indian citizen discover, verify, and apply for government schemes across agriculture, health, education, housing and more." data-hi="सरल नीति प्रत्येक भारतीय नागरिक को कृषि, स्वास्थ्य, शिक्षा, आवास और अन्य क्षेत्रों में सरकारी योजनाओं को खोजने, सत्यापित करने और आवेदन करने में मदद करती है।">
        Saral Niti helps every Indian citizen discover, verify, and apply
        for government schemes across agriculture, health, education,
        housing and more.
    </p>

    <div class="search-bar">
        <input
            type="text"
            id="searchInput"
            placeholder="Search schemes... e.g. farmer, 25, student"
            data-placeholder-en="Search schemes... e.g. farmer, 25, student"
            data-placeholder-hi="योजनाएं खोजें... जैसे किसान, 25, छात्र"
        >
        <button class="search-btn" onclick="handleSearch()" data-en="Search" data-hi="खोजें">Search</button>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-num" id="totalCount">50+</div>
            <div class="stat-label" data-en="Active Schemes" data-hi="सक्रिय योजनाएं">Active Schemes</div>
        </div>

        <div class="stat">
            <div class="stat-num">11</div>
            <div class="stat-label" data-en="Categories" data-hi="श्रेणियां">Categories</div>
        </div>

        <div class="stat">
            <div class="stat-num">100%</div>
            <div class="stat-label" data-en="Free to Apply" data-hi="निःशुल्क आवेदन">Free to Apply</div>
        </div>

    </div>
</section>
