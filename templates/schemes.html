<!-- ══════════════ SCHEMES SECTION ══════════════ -->
<main class="main">
  <div class="section-header">
    <div>
      <div class="section-title" data-en="Browse by Category" data-hi="श्रेणी के अनुसार खोजें">Browse by Category</div>
      <div class="section-sub" data-en="Select a category to filter schemes" data-hi="योजनाओं को फ़िल्टर करने के लिए श्रेणी चुनें">Select a category to filter schemes</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filters" id="schemes">
    <button class="filter-btn active" onclick="filterByCategory('all', this)" id='schemes' data-en="All" data-hi="सभी">All</button>
    <button class="filter-btn" onclick="filterByCategory('agriculture', this)" data-en="🌾 Agriculture" data-hi="🌾 कृषि">🌾 Agriculture</button>
    <button class="filter-btn" onclick="filterByCategory('health', this)" data-en="🏥 Health" data-hi="🏥 स्वास्थ्य">🏥 Health</button>
    <button class="filter-btn" onclick="filterByCategory('education', this)" data-en="📚 Education" data-hi="📚 शिक्षा">📚 Education</button>
    <button class="filter-btn" onclick="filterByCategory('housing', this)" data-en="🏠 Housing" data-hi="🏠 आवास">🏠 Housing</button>
    <button class="filter-btn" onclick="filterByCategory('employment', this)" data-en="💼 Employment" data-hi="💼 रोजगार">💼 Employment</button>
    <button class="filter-btn" onclick="filterByCategory('women', this)" data-en="👩 Women" data-hi="👩 महिला">👩 Women</button>
    <button class="filter-btn" onclick="filterByCategory('financial', this)" data-en="💰 Financial" data-hi="💰 वित्तीय">💰 Financial</button>
    <button class="filter-btn" onclick="filterByCategory('elderly', this)" data-en="👴 Elderly" data-hi="👴 वृद्धावस्था">👴 Elderly</button>
    <button class="filter-btn" onclick="filterByCategory('youth', this)" data-en="🧑 Youth" data-hi="🧑 युवा">🧑 Youth</button>
    <button class="filter-btn" onclick="filterByCategory('disability', this)" data-en="♿ Disability" data-hi="♿ दिव्यांगजन">♿ Disability</button>
    <button class="filter-btn" onclick="filterByCategory('rural', this)" data-en="🏡 Rural Area" data-hi="🏡 ग्रामीण क्षेत्र">🏡 Rural Area</button>
  </div>

  <!-- RESULTS BAR -->
  <div class="results-bar">
    <div class="results-count" id="resultsCount">Loading schemes...</div>
  </div>

  <!-- SCHEMES GRID -->
  <div id="schemesGrid" class="schemes-grid">
    <div class="loading">
      <div class="spinner"></div>
      <span>Fetching schemes...</span>
    </div>
  </div>
</main>
