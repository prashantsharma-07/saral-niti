<!-- ══════════════ SCHEME DETAIL MODAL ══════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-category" id="modalCategory"></div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-ministry" id="modalMinistry"></div>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="modal-section-title" data-en="About this Scheme" data-hi="इस योजना के बारे में">About this Scheme</div>
        <div class="modal-desc" id="modalDesc"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title" data-en="Benefits" data-hi="योजना के लाभ">Benefits</div>
        <div class="benefit-box" id="modalBenefits"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title" data-en="Eligibility" data-hi="पात्रता एवं शर्तें">Eligibility</div>
        <div class="eligibility-grid" id="modalEligibility"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title" data-en="Tags" data-hi="संबंधित टैग्स">Tags</div>
        <div class="tags-wrap" id="modalTags"></div>
      </div>
    </div>
    <div class="modal-footer">
      <a href="#" id="modalApplyBtn" target="_blank" class="btn-primary" data-en="Apply Now →" data-hi="आवेदन करें →">Apply Now →</a>
      <button class="btn-secondary" onclick="closeModal()" data-en="Close" data-hi="बंद करें">Close</button>
    </div>
  </div>
</div>
